<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>용두3구역 자료열람</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f5f5;
    }

    /* 상단 */
    .header {
      height: 110px;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      padding: 15px;
      text-align: center;
    }

    .header h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    /* PDF 선택 버튼 */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button {
      padding: 10px 20px;
      border: 0;
      border-radius: 6px;
      background: #333;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    /* PDF 영역 */
    .viewer {
      width: 100%;
      height: calc(100vh - 110px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    /* 모바일 */
    @media (max-width: 600px) {
      .header {
        height: 120px;
      }

      .header h2 {
        font-size: 18px;
      }

      button {
        flex: 1;
        padding: 10px 5px;
        font-size: 14px;
      }

      .viewer {
        height: calc(100vh - 120px);
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h2>용두3구역 설계자 자료열람</h2>

    <div class="buttons">
      <button onclick="openPDF('01.pdf')">
        자료 1
      </button>

      <button onclick="openPDF('02.pdf')">
        자료 2
      </button>
    </div>
  </div>

  <div class="viewer">
    <iframe
      id="pdfViewer"
      src="01.pdf">
    </iframe>
  </div>

  <script>
    function openPDF(file) {
      document.getElementById("pdfViewer").src = file;
    }
  </script>

</body>
</html>
